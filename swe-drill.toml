[arms."copilot-gpt-6.1-sol"]
agent = "swe_drill.agents.copilot_cli:CopilotCli"
model = "gpt-6.1-sol"
kwargs = { version = "1.0.107", reasoning_effort = "high" }

[arms.hve-sol]
agent = "swe_drill.agents.hve:CopilotCliHve"
