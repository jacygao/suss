swe_rebench = "../tasks/swe-rebench-07-2026"
senior_swe_bench = "../tasks/senior/senior-swe-bench-v2026.06"
environment = "modal"
k = 1
concurrency = 32

[arms.copilot-sonnet]
agent = "swe_drill.agents.copilot_cli:CopilotCli"
model = "claude-sonnet-5.5"
