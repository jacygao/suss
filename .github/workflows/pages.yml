name: Leaderboard site

# Publishes site/ to GitHub Pages whenever it changes on main. Starting it by
# hand republishes main as it stands, as after a rename moves the address.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Pages lets a browser keep a script or stylesheet for ten minutes, so each
      # deploy gives them a new URL, which a reload of the page fetches at once.
      - name: Version the script and stylesheet
        run: sed -E -i "s/(app\.js|styles\.css)\"/\1?v=${GITHUB_SHA::7}\"/g" site/index.html && grep -E 'app\.js\?v=|styles\.css\?v=' site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
